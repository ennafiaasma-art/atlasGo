version: '3.8'

services:
  # 1. Backend (Laravel)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas_go_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    networks:
      - atlas-go-network
    environment:
      - DB_HOST=db
      - DB_DATABASE=atlasgo
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  # 2. Database (MySQL)
  db:
    image: mysql:8.0
    container_name: atlas_go_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: atlasgo
      MYSQL_ROOT_PASSWORD: root
    # ports:
    #   - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - atlas-go-network

  # 3. Frontend (React / Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas_go_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - atlas-go-network

volumes:
  dbdata:

networks:
  atlas-go-network:
    driver: bridge